  <g class="r1"><text x="50" y="188" font-size="12" class="mono" style="fill:#8fbfff">create_custom_firewall_zone</text><text x="300" y="188" font-size="12" class="mono" style="fill:#8b96ad">mcp-test-zone</text></g><text class="k1" x="524" y="188" font-size="13" font-weight="800" style="fill:#3ddc84">✓</text>
  <g class="r2"><text x="50" y="208" font-size="12" class="mono" style="fill:#8fbfff">create_firewall_policy</text><text x="300" y="208" font-size="12" class="mono" style="fill:#8b96ad">mcp-test-policy</text></g><text class="k2" x="524" y="208" font-size="13" font-weight="800" style="fill:#3ddc84">✓</text>
