  <g class="r10"><text x="50" y="368" font-size="12" class="mono" style="fill:#8fbfff">delete_* (9 tools)</text><text x="300" y="368" font-size="12" class="mono" style="fill:#8b96ad">everything removed</text></g><text class="k10" x="524" y="368" font-size="13" font-weight="800" style="fill:#3ddc84">✓</text>
