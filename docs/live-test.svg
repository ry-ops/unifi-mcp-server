<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Tested on a real console</title>
  <desc id="d">A replay of the live test of all 32 tools that change a network, on a UniFi Dream Machine Pro running Network 11.0.83. Each create adds an mcp-test object to the site map; updates, patches and reorders follow; restart, power-cycle, client, adopt and unadopt actions are sent to an unknown ID and refused with 404 while every real device stays online; the deletes remove every test object. 32 of 32 passed and nothing was left behind.</desc>
