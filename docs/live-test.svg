  <g class="r4"><text x="50" y="248" font-size="12" class="mono" style="fill:#8fbfff">generate_vouchers</text><text x="300" y="248" font-size="12" class="mono" style="fill:#8b96ad">2 vouchers</text></g><text class="k4" x="524" y="248" font-size="13" font-weight="800" style="fill:#3ddc84">✓</text>
  <g class="r5"><text x="50" y="268" font-size="12" class="mono" style="fill:#8fbfff">create_network</text><text x="300" y="268" font-size="12" class="mono" style="fill:#8b96ad">mcp-test-net, disabled</text></g><text class="k5" x="524" y="268" font-size="13" font-weight="800" style="fill:#3ddc84">✓</text>
