  <rect width="960" height="650" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">The toolbox</text>
  <text x="30" y="78" font-size="15" class="muted">One tool for every UniFi Network API call, a few helpers, and playbooks that tell an AI how to use them safely.</text>

  <!-- tools -->
  <text x="30" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">87 TOOLS</text>
  <g class="g0"><rect x="30" y="118" width="290" height="109" rx="12" fill="#3ec7ff" fill-opacity=".1" stroke="#3ec7ff" stroke-opacity=".6"/><text x="44" y="138" font-size="14" font-weight="700">Helpers</text><text x="306" y="139" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ec7ff">5</text><text x="44" y="156" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">unifi_health</text><text x="44" y="171" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">get_site_status</text><text x="44" y="186" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">search_site</text><text x="44" y="201" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">list_operations</text><text x="44" y="216" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">describe_operation</text></g>
  <g class="g1"><rect x="30" y="235" width="290" height="250" rx="12" fill="#b58cff" fill-opacity=".1" stroke="#b58cff" stroke-opacity=".6"/><text x="44" y="255" font-size="14" font-weight="700">Network API v10.6.106</text><text x="306" y="256" text-anchor="end" font-size="16" font-weight="800" style="fill:#b58cff">73</text><text x="44" y="273" font-size="11" class="muted">Every operation in the spec, by group:</text>
    <text x="44" y="297" font-size="11" class="mono" style="fill:#d4bfff">Firewall</text><text x="168" y="297" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">13</text>
    <text x="44" y="319" font-size="11" class="mono" style="fill:#d4bfff">Devices</text><text x="168" y="319" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">8</text>
    <text x="44" y="341" font-size="11" class="mono" style="fill:#d4bfff">Supporting</text><text x="168" y="341" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">8</text>
    <text x="44" y="363" font-size="11" class="mono" style="fill:#d4bfff">ACL rules</text><text x="168" y="363" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">7</text>
    <text x="44" y="385" font-size="11" class="mono" style="fill:#d4bfff">Networks</text><text x="168" y="385" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">6</text>
    <text x="44" y="407" font-size="11" class="mono" style="fill:#d4bfff">Switching</text><text x="168" y="407" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">6</text>
    <text x="44" y="429" font-size="11" class="mono" style="fill:#d4bfff">DNS policies</text><text x="168" y="429" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">5</text>
    <text x="186" y="297" font-size="11" class="mono" style="fill:#d4bfff">Hotspot</text><text x="306" y="297" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">5</text>
    <text x="186" y="319" font-size="11" class="mono" style="fill:#d4bfff">Traffic lists</text><text x="306" y="319" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">5</text>
    <text x="186" y="341" font-size="11" class="mono" style="fill:#d4bfff">Wi-Fi</text><text x="306" y="341" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">5</text>
    <text x="186" y="363" font-size="11" class="mono" style="fill:#d4bfff">Clients</text><text x="306" y="363" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">3</text>
    <text x="186" y="385" font-size="11" class="mono" style="fill:#d4bfff">Sites</text><text x="306" y="385" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">1</text>
    <text x="186" y="407" font-size="11" class="mono" style="fill:#d4bfff">App info</text><text x="306" y="407" text-anchor="end" font-size="11" font-weight="700" style="fill:#b58cff">1</text>
    <text x="44" y="458" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">list_firewall_policies · create_network</text><text x="44" y="473" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">execute_port_action · generate_vouchers …</text></g>
  <g class="g2"><rect x="30" y="493" width="290" height="115" rx="12" fill="#3ddc84" fill-opacity=".1" stroke="#3ddc84" stroke-opacity=".6"/><text x="44" y="513" font-size="14" font-weight="700">Site Manager (cloud)</text><text x="306" y="514" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ddc84">9</text><text x="44" y="531" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">cloud_list_hosts · cloud_get_host_by_id</text><text x="44" y="546" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">cloud_list_sites · cloud_list_devices</text><text x="44" y="561" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">cloud_get_isp_metrics</text><text x="44" y="576" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">cloud_query_isp_metrics</text><text x="44" y="591" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">cloud_*_sd_wan_config* (3)</text></g>

  <!-- safety, resources, path -->
  <text x="340" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">50 READ · 32 CHANGE</text>
  <g class="rs"><rect x="340" y="118" width="280" height="490" rx="12" fill="#10283a" fill-opacity=".6" stroke="#3ec7ff" stroke-opacity=".5"/>
    <text x="352" y="142" font-size="12" class="muted">Every tool carries MCP safety hints:</text>
    <rect x="352" y="156" width="156" height="14" rx="4" fill="#3ddc84"/><rect x="508" y="156" width="28" height="14" fill="#ffb02e"/><rect x="536" y="156" width="72" height="14" rx="4" fill="#ff5c8a"/>
    <circle cx="358" cy="190" r="5" fill="#3ddc84"/><text x="372" y="194" font-size="12">50 only read</text>
    <circle cx="358" cy="212" r="5" fill="#ffb02e"/><text x="372" y="216" font-size="12">9 create or adopt</text>
    <circle cx="358" cy="234" r="5" fill="#ff5c8a"/><text x="372" y="238" font-size="12">23 delete, replace or restart</text>
    <text x="352" y="266" font-size="11" class="mono" style="fill:#a8e4ff">UNIFI_READ_ONLY=true</text><text x="352" y="284" font-size="11.5" class="muted">registers 55 tools; none can change anything</text>
    <line x1="352" y1="306" x2="608" y2="306" stroke="#3ec7ff" stroke-opacity=".3"/>
    <text x="352" y="328" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">3 RESOURCES · READ-ONLY</text>
    <text x="352" y="352" font-size="11" class="mono" style="fill:#a8e4ff">unifi://health</text><text x="352" y="374" font-size="11" class="mono" style="fill:#a8e4ff">unifi://sites/{id}/devices</text><text x="352" y="396" font-size="11" class="mono" style="fill:#a8e4ff">unifi://sites/{id}/clients</text>
    <line x1="352" y1="418" x2="608" y2="418" stroke="#3ec7ff" stroke-opacity=".3"/>
    <text x="352" y="440" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">ONE KEY, ONE HOST</text>
    <circle cx="358" cy="466" r="5" fill="#3ddc84"/><text x="372" y="470" font-size="12.5">api.ui.com · your API key</text>
    <line x1="358" y1="472" x2="358" y2="490" stroke="#2c3750" stroke-width="2"/>
    <circle cx="358" cy="496" r="5" fill="#7aa7ff"/><text x="372" y="500" font-size="12.5">cloud connector</text>
    <line x1="358" y1="502" x2="358" y2="520" stroke="#2c3750" stroke-width="2"/>
    <circle cx="358" cy="526" r="5" fill="#b58cff"/><text x="372" y="530" font-size="12.5">your console · Network app</text>
    <text x="352" y="566" font-size="11.5" class="muted">No VPN, no console IP, no self-signed</text><text x="352" y="584" font-size="11.5" class="muted">certificates. Console and site auto-detected.</text></g>

  <!-- playbook -->
  <text x="640" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">4 PLAYBOOKS · e.g. change_firewall_safely</text>
  <rect x="640" y="118" width="290" height="490" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="656" y="146" font-size="13" font-weight="700">Read → schema → confirm → act</text>
  <g class="s0"><circle class="sd0" cx="664" cy="178" r="13" fill="#232c3f"/><text x="664" y="182" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">1</text><text x="688" y="176" font-size="13" font-weight="700">Read</text><text x="688" y="192" font-size="11" class="mono muted">list_firewall_zones</text></g><line x1="664" y1="192" x2="664" y2="208" stroke="#2c3750" stroke-width="2"/><g class="s1"><circle class="sd1" cx="664" cy="222" r="13" fill="#232c3f"/><text x="664" y="226" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">2</text><text x="688" y="220" font-size="13" font-weight="700">Schema</text><text x="688" y="236" font-size="11" class="mono muted">describe_operation</text></g><line x1="664" y1="236" x2="664" y2="252" stroke="#2c3750" stroke-width="2"/><g class="s2"><circle class="sd2" cx="664" cy="266" r="13" fill="#232c3f"/><text x="664" y="270" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">3</text><text x="688" y="264" font-size="13" font-weight="700">Confirm</text><text x="688" y="280" font-size="11" class="mono muted">“Block IoT → LAN?” → yes</text></g><line x1="664" y1="280" x2="664" y2="296" stroke="#2c3750" stroke-width="2"/><g class="s3"><circle class="sd3" cx="664" cy="310" r="13" fill="#232c3f"/><text x="664" y="314" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">4</text><text x="688" y="308" font-size="13" font-weight="700">Act</text><text x="688" y="324" font-size="11" class="mono muted">create_firewall_policy</text></g><line x1="664" y1="324" x2="664" y2="340" stroke="#2c3750" stroke-width="2"/><g class="s4"><circle class="sd4" cx="664" cy="354" r="13" fill="#232c3f"/><text x="664" y="358" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">5</text><text x="688" y="352" font-size="13" font-weight="700">Check</text><text x="688" y="368" font-size="11" class="mono muted">…_firewall_policy_ordering</text></g>
  <line x1="656" y1="408" x2="914" y2="408" stroke="#2c3750"/><text x="656" y="430" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">ALL 4 PLAYBOOKS</text><text x="656" y="452" font-size="11" class="mono" style="fill:#8b96ad">check_unifi_health</text><text x="656" y="469" font-size="11" class="mono" style="fill:#8b96ad">restart_device</text><text x="656" y="486" font-size="11" class="mono" style="fill:#ffb02e">change_firewall_safely</text><text x="656" y="503" font-size="11" class="mono" style="fill:#8b96ad">guest_access</text>
  <text x="656" y="540" font-size="11.5" class="muted">Request bodies follow the spec;</text><text x="656" y="558" font-size="11.5" class="muted">describe_operation returns the full</text><text x="656" y="576" font-size="11.5" class="muted">schema before any create or update.</text>
  <text x="30" y="632" font-size="12" class="muted">Playbooks guide the AI to confirm with you before it acts; the tools themselves don't enforce it, so keep tool approval on or set UNIFI_READ_ONLY=true.</text>
</svg>
