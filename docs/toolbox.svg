<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
  <title id="t">The UniFi MCP toolbox: 87 tools, 3 resources, 4 playbooks</title>
  <desc id="d">The server's 87 tools: 5 helpers, 73 tools covering every UniFi Network API v10.6.106 operation in 13 groups, and 9 Site Manager tools. 50 tools only read and 32 can change things, 23 of them disruptively; UNIFI_READ_ONLY=true leaves 55 tools that cannot change anything. Every call goes to api.ui.com with one key and reaches the console through the cloud connector. The change-firewall-safely playbook walks an AI through reading zones and policies, fetching the exact schema, confirming the JSON with you, creating the policy, and checking where it landed in the ordering.</desc>
