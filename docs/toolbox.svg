<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
  <title id="t">The UniFi MCP toolbox: 26 tools, 13 resources, 9 playbooks</title>
  <desc id="d">The server's 26 tools in four groups: monitor (6), find and discover (9), act (9) and debug (2). It also exposes 13 read-only resources such as sites/devices and clients/active, and 9 prompt playbooks. The block-a-client playbook walks an AI through reading active clients, matching the device, confirming with you, calling block_client, and offering unblock_client to undo.</desc>
