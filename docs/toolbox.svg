  <rect width="960" height="650" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">The toolbox</text>
  <text x="30" y="78" font-size="15" class="muted">Tools to act, resources to read, and playbooks that tell an AI how to use them safely.</text>
  <text x="30" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">26 TOOLS</text>
  <g class="g0"><rect x="30" y="118" width="290" height="124" rx="12" fill="#3ec7ff" fill-opacity=".1" stroke="#3ec7ff" stroke-opacity=".6"/><text x="44" y="138" font-size="14" font-weight="700">Monitor</text><text x="306" y="139" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ec7ff">6</text><text x="44" y="156" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">unifi_health</text><text x="44" y="171" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">get_system_status</text><text x="44" y="186" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">get_device_health</text><text x="44" y="201" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">get_client_activity</text><text x="44" y="216" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">get_quick_status</text><text x="44" y="231" font-size="10.5" class="mono" style="fill:#3ec7ff" opacity=".9">list_active_clients</text></g><g class="g1"><rect x="30" y="250" width="290" height="139" rx="12" fill="#b58cff" fill-opacity=".1" stroke="#b58cff" stroke-opacity=".6"/><text x="44" y="270" font-size="14" font-weight="700">Find &amp; discover</text><text x="306" y="271" text-anchor="end" font-size="16" font-weight="800" style="fill:#b58cff">9</text><text x="44" y="288" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">discover_sites</text><text x="44" y="303" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">list_hosts</text><text x="44" y="318" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">list_hosts_cloud</text><text x="44" y="333" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">list_all_hosts</text><text x="44" y="348" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">find_host_everywhere</text><text x="44" y="363" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">find_device_by_mac</text><text x="44" y="378" font-size="10.5" class="mono" style="fill:#b58cff" opacity=".9">+3 more</text></g><g class="g2"><rect x="30" y="397" width="290" height="139" rx="12" fill="#ff8a5c" fill-opacity=".1" stroke="#ff8a5c" stroke-opacity=".6"/><text x="44" y="417" font-size="14" font-weight="700">Act</text><text x="306" y="418" text-anchor="end" font-size="16" font-weight="800" style="fill:#ff8a5c">9</text><text x="44" y="435" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">block_client · unblock_client</text><text x="44" y="450" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">kick_client · locate_device</text><text x="44" y="465" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">wlan_set_enabled_legacy</text><text x="44" y="480" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">access_unlock_door</text><text x="44" y="495" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">protect_camera_reboot</text><text x="44" y="510" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">protect_camera_led</text><text x="44" y="525" font-size="10.5" class="mono" style="fill:#ff8a5c" opacity=".9">protect_toggle_privacy</text></g><g class="g3"><rect x="30" y="544" width="290" height="64" rx="12" fill="#3ddc84" fill-opacity=".1" stroke="#3ddc84" stroke-opacity=".6"/><text x="44" y="564" font-size="14" font-weight="700">Debug</text><text x="306" y="565" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ddc84">2</text><text x="44" y="582" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">debug_api_connectivity</text><text x="44" y="597" font-size="10.5" class="mono" style="fill:#3ddc84" opacity=".9">debug_registry</text></g>
  <text x="340" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">13 RESOURCES · READ-ONLY</text>
  <g class="rs"><rect x="340" y="118" width="280" height="490" rx="12" fill="#10283a" fill-opacity=".6" stroke="#3ec7ff" stroke-opacity=".5"/>
  <text x="352" y="142" font-size="12" class="muted">Context the AI can pull in by URI:</text>
  <text x="352" y="170" font-size="11" class="mono" style="fill:#a8e4ff">unifi://health</text><text x="352" y="192" font-size="11" class="mono" style="fill:#a8e4ff">health://unifi · status://unifi</text><text x="352" y="214" font-size="11" class="mono" style="fill:#a8e4ff">unifi://capabilities</text><text x="352" y="236" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/devices</text><text x="352" y="258" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/clients</text><text x="352" y="280" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/clients/active</text><text x="352" y="302" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/wlans</text><text x="352" y="324" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/search/clients/{q}</text><text x="352" y="346" font-size="11" class="mono" style="fill:#a8e4ff">sites://{id}/search/devices/{q}</text><text x="352" y="368" font-size="11" class="mono" style="fill:#a8e4ff">status://system · /devices · /clients</text><line x1="352" y1="398" x2="608" y2="398" stroke="#3ec7ff" stroke-opacity=".3"/><text x="352" y="420" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">TALKS TO 5 UNIFI APIS</text><circle cx="358" cy="444" r="5" fill="#3ec7ff"/><text x="372" y="448" font-size="12.5">Network · Integration API v1</text><circle cx="358" cy="474" r="5" fill="#7aa7ff"/><text x="372" y="478" font-size="12.5">Network · classic API</text><circle cx="358" cy="504" r="5" fill="#ff8a5c"/><text x="372" y="508" font-size="12.5">Protect · cameras</text><circle cx="358" cy="534" r="5" fill="#ffb02e"/><text x="372" y="538" font-size="12.5">Access · doors</text><circle cx="358" cy="564" r="5" fill="#b58cff"/><text x="372" y="568" font-size="12.5">Site Manager · cloud</text></g>
  <text x="640" y="106" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">9 PLAYBOOKS · e.g. how_to_block_client</text>
  <rect x="640" y="118" width="290" height="490" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="656" y="146" font-size="13" font-weight="700">Search → confirm → act</text>
  <g class="s0"><circle class="sd0" cx="664" cy="178" r="13" fill="#232c3f"/><text x="664" y="182" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">1</text><text x="688" y="176" font-size="13" font-weight="700">Read</text><text x="688" y="192" font-size="11" class="mono muted">sites://{id}/clients/active</text></g><line x1="664" y1="192" x2="664" y2="208" stroke="#2c3750" stroke-width="2"/><g class="s1"><circle class="sd1" cx="664" cy="222" r="13" fill="#232c3f"/><text x="664" y="226" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">2</text><text x="688" y="220" font-size="13" font-weight="700">Match</text><text x="688" y="236" font-size="11" class="mono muted">the MAC or hostname</text></g><line x1="664" y1="236" x2="664" y2="252" stroke="#2c3750" stroke-width="2"/><g class="s2"><circle class="sd2" cx="664" cy="266" r="13" fill="#232c3f"/><text x="664" y="270" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">3</text><text x="688" y="264" font-size="13" font-weight="700">Confirm</text><text x="688" y="280" font-size="11" class="mono muted">“Block kids-tablet?” → yes</text></g><line x1="664" y1="280" x2="664" y2="296" stroke="#2c3750" stroke-width="2"/><g class="s3"><circle class="sd3" cx="664" cy="310" r="13" fill="#232c3f"/><text x="664" y="314" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">4</text><text x="688" y="308" font-size="13" font-weight="700">Act</text><text x="688" y="324" font-size="11" class="mono muted">block_client</text></g><line x1="664" y1="324" x2="664" y2="340" stroke="#2c3750" stroke-width="2"/><g class="s4"><circle class="sd4" cx="664" cy="354" r="13" fill="#232c3f"/><text x="664" y="358" text-anchor="middle" font-size="12" font-weight="800" style="fill:#0f1420">5</text><text x="688" y="352" font-size="13" font-weight="700">Offer</text><text x="688" y="368" font-size="11" class="mono muted">unblock_client to undo</text></g>
  <line x1="656" y1="408" x2="914" y2="408" stroke="#2c3750"/><text x="656" y="430" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">ALL 9 PLAYBOOKS</text><text x="656" y="452" font-size="11" class="mono" style="fill:#8b96ad">how_to_check_unifi_health</text><text x="656" y="469" font-size="11" class="mono" style="fill:#8b96ad">how_to_check_system_status</text><text x="656" y="486" font-size="11" class="mono" style="fill:#8b96ad">how_to_monitor_devices</text><text x="656" y="503" font-size="11" class="mono" style="fill:#8b96ad">how_to_check_network_activity</text><text x="656" y="520" font-size="11" class="mono" style="fill:#8b96ad">how_to_find_device</text><text x="656" y="537" font-size="11" class="mono" style="fill:#ffb02e">how_to_block_client</text><text x="656" y="554" font-size="11" class="mono" style="fill:#8b96ad">how_to_toggle_wlan</text><text x="656" y="571" font-size="11" class="mono" style="fill:#8b96ad">how_to_list_hosts</text><text x="656" y="588" font-size="11" class="mono" style="fill:#8b96ad">how_to_debug_api_issues</text>
  <text x="30" y="632" font-size="12" class="muted">Playbooks guide the AI to confirm with you before it acts; the tools themselves don't enforce it, so give the server only the access you're happy for it to use.</text>
</svg>
