    @keyframes sd0 { 0%,26.00% { fill: #232c3f; } 29.00%,94% { fill: #3ec7ff; } 100% { fill: #232c3f; } } .sd0 { animation: sd0 10.0s infinite; }
    @keyframes s1 { 0%,37.00% { opacity: .25; } 40.00%,94% { opacity: 1; } 100% { opacity: .25; } } .s1 { animation: s1 10.0s infinite; }
    @keyframes sd1 { 0%,37.00% { fill: #232c3f; } 40.00%,94% { fill: #b58cff; } 100% { fill: #232c3f; } } .sd1 { animation: sd1 10.0s infinite; }
    @keyframes s2 { 0%,48.00% { opacity: .25; } 51.00%,94% { opacity: 1; } 100% { opacity: .25; } } .s2 { animation: s2 10.0s infinite; }
    @keyframes sd2 { 0%,48.00% { fill: #232c3f; } 51.00%,94% { fill: #ffb02e; } 100% { fill: #232c3f; } } .sd2 { animation: sd2 10.0s infinite; }
    @keyframes s3 { 0%,59.00% { opacity: .25; } 62.00%,94% { opacity: 1; } 100% { opacity: .25; } } .s3 { animation: s3 10.0s infinite; }
    @keyframes sd3 { 0%,59.00% { fill: #232c3f; } 62.00%,94% { fill: #ff8a5c; } 100% { fill: #232c3f; } } .sd3 { animation: sd3 10.0s infinite; }
    @keyframes s4 { 0%,70.00% { opacity: .25; } 73.00%,94% { opacity: 1; } 100% { opacity: .25; } } .s4 { animation: s4 10.0s infinite; }
    @keyframes sd4 { 0%,70.00% { fill: #232c3f; } 73.00%,94% { fill: #3ddc84; } 100% { fill: #232c3f; } } .sd4 { animation: sd4 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
