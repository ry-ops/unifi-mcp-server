    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,2.00% { opacity: 0; transform: translateX(-10px); } 6.00%,94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } } .g0 { animation: g0 10.0s infinite; }
    @keyframes g1 { 0%,6.00% { opacity: 0; transform: translateX(-10px); } 10.00%,94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } } .g1 { animation: g1 10.0s infinite; }
