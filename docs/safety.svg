  <title id="t">Read-only mode</title>
  <desc id="d">87 tool tiles: 55 that only read, 9 that create or adopt, and 23 that delete, replace or restart. When UNIFI_READ_ONLY switches to true, the 32 tiles that can change the network fade out and the count drops from 87 tools to 55.</desc>
